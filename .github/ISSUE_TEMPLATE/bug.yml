name: Bug
description: Something in the app does not work.
title: "Bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: SkyClaw version
      description: Settings shows it under the app name.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: macOS version
      placeholder: "15.1"
    validations:
      required: true
  - type: input
    id: sessions
    attributes:
      label: Claude Code sessions running
      placeholder: "3"
  - type: dropdown
    id: displays
    attributes:
      label: External displays
      options:
        - None
        - One
        - Two or more
